{% extends "base.html" %}
{% block title %}Reset password | Luma &amp; Co.{% endblock %}
{% block content %}<div class="container narrow-shell"><div class="auth-card"><p class="eyebrow">Account access</p><h1>Reset your password</h1><p class="auth-card__intro">Enter your email and we’ll send a reset link.</p><form class="form-stack" method="post">{% csrf_token %}<div><label for="{{ form.email.id_for_label }}">Email address</label>{{ form.email }}</div><button class="button button--dark button--wide" type="submit">Send reset link <span>→</span></button></form><p class="auth-card__footer"><a href="{% url 'accounts:login' %}">← Back to sign in</a></p></div></div>{% endblock %}
